# Builds the Windows installer and the Mac disk image (specs/004-installers),
# and the signed update files and feed (specs/009-updates).
# Started by hand, it signs the builds and attaches everything to a draft
# release. On a pull request that changes this file it only builds, unsigned
# and without update files, so the workflow is tested before it reaches main
# and a pull request never sees a secret. Adapted from Handy's build.yml and
# release.yml. Actions are pinned to a commit. Only the release job can write,
# and only when the workflow was started by hand.
name: release

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/release.yml"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            args: "--bundles nsis"
            bundle-dir: src-tauri/target/release/bundle/nsis
            pattern: "*-setup.exe"
            suffix: windows-x64-setup.exe
            # On Windows the installer itself is the update.
            update-dir: src-tauri/target/release/bundle/nsis
            update-pattern: "*-setup.exe"
            update-suffix: windows-x64-setup.exe
          # macOS 26 for the Apple Intelligence SDK, as in Handy's workflow.
          - name: macos-arm64
            os: macos-26
            args: "--target aarch64-apple-darwin --bundles app,dmg"
            bundle-dir: src-tauri/target/aarch64-apple-darwin/release/bundle/dmg
            pattern: "*.dmg"
            suffix: macos-arm64.dmg
            update-dir: src-tauri/target/aarch64-apple-darwin/release/bundle/macos
            update-pattern: "*.app.tar.gz"
            update-suffix: macos-arm64.app.tar.gz
    steps:
      # Deep build paths. The speech engine's own build works around the
      # 260-character limit; this is for git and the other tools.
      - name: Enable long paths (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem" `
            -Name "LongPathsEnabled" -Value 1 -PropertyType DWORD -Force
          git config --system core.longpaths true

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      # A release is always compiled from scratch: no cache is restored, so a
      # stale native library can never be linked into an installer.
      - name: Install Rust stable
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          if [ "$RUNNER_OS" = "macOS" ]; then rustup target add aarch64-apple-darwin; fi
          rustc --version

      - name: Install Vulkan SDK (Windows)
        if: runner.os == 'Windows'
        uses: humbletim/install-vulkan-sdk@30ba978f977e81b72d091fc8888feb1fb26f9aff # v1.2
        with:
          version: 1.4.309.0
          cache: true

      # build.rs stages these runtime files beside the app (it reads
      # HANDY_VC_REDIST_DIRS), so the app runs without a separate install.
      - name: Locate the VC++ runtime (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsRoot = & $vswhere -latest -products * -property installationPath
          if (-not $vsRoot) { throw "vswhere found no Visual Studio installation" }
          $versionFile = Join-Path $vsRoot "VC\Auxiliary\Build\Microsoft.VCRedistVersion.default.txt"
          $redistVersion = (Get-Content $versionFile).Trim()
          $archDir = Join-Path $vsRoot "VC\Redist\MSVC\$redistVersion\x64"
          if (-not (Test-Path $archDir)) { throw "VC++ redist dir not found: $archDir" }
          $crt = Get-ChildItem $archDir -Directory -Filter "Microsoft.VC*.CRT" |
            Sort-Object Name | Select-Object -Last 1
          if (-not $crt -or -not (Test-Path (Join-Path $crt.FullName "msvcp140.dll"))) {
            throw "VC++ CRT redist dir not found or incomplete under: $archDir"
          }
          $omp = Get-ChildItem $archDir -Directory -Filter "Microsoft.VC*.OpenMP" |
            Sort-Object Name | Select-Object -Last 1
          if (-not $omp -or -not (Test-Path (Join-Path $omp.FullName "vcomp140.dll"))) {
            throw "VC++ OpenMP redist dir not found or incomplete under: $archDir"
          }
          $dirs = "$($crt.FullName);$($omp.FullName)"
          Write-Host "HANDY_VC_REDIST_DIRS=$dirs"
          Add-Content -Path $env:GITHUB_ENV -Value "HANDY_VC_REDIST_DIRS=$dirs"

      - name: Install SPIRV headers for the Vulkan build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          vcpkg install spirv-headers:x64-windows
          if ($LASTEXITCODE -ne 0) { throw "vcpkg install spirv-headers failed" }
          $prefix = "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows" -replace '\\','/'
          $combined = if ($env:CMAKE_PREFIX_PATH) { "$prefix;$env:CMAKE_PREFIX_PATH" } else { $prefix }
          Add-Content $env:GITHUB_ENV "CMAKE_PREFIX_PATH=$combined"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Started by hand only: the update key on both systems, and the Slash
      # Voice certificate on the Mac, so every Mac build keeps the same
      # signature and macOS keeps its permissions. Each secret is checked to be
      # present; none is printed.
      - name: Signing keys (started by hand only)
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          UPDATE_KEY: ${{ github.event_name == 'workflow_dispatch' && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          UPDATE_KEY_PASSWORD: ${{ github.event_name == 'workflow_dispatch' && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
          MAC_CERT: ${{ github.event_name == 'workflow_dispatch' && matrix.name == 'macos-arm64' && secrets.APPLE_CERTIFICATE || '' }}
          MAC_CERT_PASSWORD: ${{ github.event_name == 'workflow_dispatch' && matrix.name == 'macos-arm64' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          IS_MAC: ${{ matrix.name == 'macos-arm64' }}
        run: |
          set -euo pipefail
          put() { local d="EOF_$(openssl rand -hex 8)"; { printf '%s<<%s\n' "$1" "$d"; printf '%s\n' "$2"; printf '%s\n' "$d"; } >> "$GITHUB_ENV"; }
          if [ -z "$UPDATE_KEY" ] || [ -z "$UPDATE_KEY_PASSWORD" ]; then
            echo "::error::The update key or its password is not set in GitHub."; exit 1
          fi
          put TAURI_SIGNING_PRIVATE_KEY "$UPDATE_KEY"
          put TAURI_SIGNING_PRIVATE_KEY_PASSWORD "$UPDATE_KEY_PASSWORD"
          if [ "$IS_MAC" = "true" ]; then
            if [ -z "$MAC_CERT" ] || ! printf '%s' "$MAC_CERT" | base64 --decode > /dev/null 2>&1; then
              echo "::error::The Mac certificate secret is missing or is not base64."; exit 1
            fi
            put APPLE_CERTIFICATE "$MAC_CERT"
            put APPLE_CERTIFICATE_PASSWORD "$MAC_CERT_PASSWORD"
            put APPLE_SIGNING_IDENTITY "Slash Voice"
          fi

      - name: Build
        shell: bash
        env:
          BUILD_ARGS: ${{ matrix.args }}
          # A pull request has no keys, so it builds without update files.
          NO_UPDATES: ${{ github.event_name != 'workflow_dispatch' }}
        run: |
          if [ "$NO_UPDATES" = "true" ]; then
            bun run tauri build $BUILD_ARGS --config '{"bundle":{"createUpdaterArtifacts":false}}'
          else
            bun run tauri build $BUILD_ARGS
          fi

      - name: Check the Mac signature (started by hand)
        if: github.event_name == 'workflow_dispatch' && matrix.name == 'macos-arm64'
        shell: bash
        run: |
          set -euo pipefail
          APP=$(find src-tauri/target/aarch64-apple-darwin/release/bundle/macos -maxdepth 1 -name "*.app" -print -quit)
          REQ=$(codesign -dr - "$APP" 2>&1 | tail -n 1)
          echo "$REQ"
          case "$REQ" in
            *'identifier "com.slashvoice.app" and certificate leaf'*) ;;
            *) echo "::error::The Mac build is not signed with the Slash Voice certificate."; exit 1 ;;
          esac

      # A missing runtime file gives an app that will not start.
      - name: Check the staged runtime files (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dlls = Get-ChildItem "src-tauri/transcribe-libs" -Filter "*.dll" -ErrorAction SilentlyContinue
          if (-not $dlls) { throw "src-tauri/transcribe-libs holds no DLLs" }
          foreach ($name in @("msvcp140.dll", "vcruntime140.dll", "vcomp140.dll")) {
            if (-not ($dlls | Where-Object { $_.Name -ieq $name })) { throw "missing $name" }
          }
          if (-not ($dlls | Where-Object { $_.Name -like "*transcribe*" })) { throw "missing the transcribe runtime" }
          if (-not ($dlls | Where-Object { $_.Name -like "*ggml*" })) { throw "missing the ggml runtime" }
          $dlls | ForEach-Object { Write-Host $_.Name }

      - name: Name the installer and write its checksum
        shell: bash
        env:
          BUNDLE_DIR: ${{ matrix.bundle-dir }}
          PATTERN: ${{ matrix.pattern }}
          SUFFIX: ${{ matrix.suffix }}
          UPDATE_DIR: ${{ matrix.update-dir }}
          UPDATE_PATTERN: ${{ matrix.update-pattern }}
          UPDATE_SUFFIX: ${{ matrix.update-suffix }}
          WITH_UPDATES: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          set -euo pipefail
          VERSION=$(grep -o '"version": "[^"]*"' src-tauri/tauri.conf.json | head -n 1 | cut -d'"' -f4)
          SRC=$(find "$BUNDLE_DIR" -maxdepth 1 -name "$PATTERN" -print -quit)
          if [ -z "$SRC" ]; then echo "::error::no file matching $PATTERN in $BUNDLE_DIR"; ls -la "$BUNDLE_DIR" || true; exit 1; fi
          ASSET="slash-voice_${VERSION}_${SUFFIX}"
          mkdir -p dist-release
          cp "$SRC" "dist-release/$ASSET"
          # The update file and its signature (started by hand only).
          if [ "$WITH_UPDATES" = "true" ]; then
            UPD=$(find "$UPDATE_DIR" -maxdepth 1 -name "$UPDATE_PATTERN" -print -quit)
            if [ -z "$UPD" ] || [ ! -f "$UPD.sig" ]; then echo "::error::no signed update file matching $UPDATE_PATTERN in $UPDATE_DIR"; ls -la "$UPDATE_DIR" || true; exit 1; fi
            UPD_ASSET="slash-voice_${VERSION}_${UPDATE_SUFFIX}"
            [ "$UPD_ASSET" = "$ASSET" ] || cp "$UPD" "dist-release/$UPD_ASSET"
            cp "$UPD.sig" "dist-release/$UPD_ASSET.sig"
          fi
          cd dist-release
          if command -v sha256sum >/dev/null 2>&1; then sha256sum "$ASSET" > "$ASSET.sha256"; else shasum -a 256 "$ASSET" > "$ASSET.sha256"; fi
          ls -l
          cat "$ASSET.sha256"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: slash-voice-${{ matrix.name }}
          path: dist-release/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: draft release
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          path: dist-release
          merge-multiple: true

      # The feed the app reads (specs/009-updates, contracts/feed.md). Every
      # address is one of this repository's release files.
      - name: Write the update feed
        env:
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          VERSION=$(grep -o '"version": "[^"]*"' src-tauri/tauri.conf.json | head -n 1 | cut -d'"' -f4)
          BASE="https://github.com/$GH_REPO/releases/download/v$VERSION"
          MAC="slash-voice_${VERSION}_macos-arm64.app.tar.gz"
          WIN="slash-voice_${VERSION}_windows-x64-setup.exe"
          for f in "$MAC" "$MAC.sig" "$WIN" "$WIN.sig"; do
            [ -f "dist-release/$f" ] || { echo "::error::missing dist-release/$f"; exit 1; }
          done
          jq -n \
            --arg version "$VERSION" \
            --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg mac_url "$BASE/$MAC" --rawfile mac_sig "dist-release/$MAC.sig" \
            --arg win_url "$BASE/$WIN" --rawfile win_sig "dist-release/$WIN.sig" \
            '{version: $version, notes: "See the release page.", pub_date: $date,
              platforms: {
                "darwin-aarch64": {url: $mac_url, signature: ($mac_sig | rtrimstr("\n"))},
                "windows-x86_64": {url: $win_url, signature: ($win_sig | rtrimstr("\n"))}}}' \
            > dist-release/latest.json
          cat dist-release/latest.json

      # A draft is refreshed; a published release is never touched. From
      # 0.2.0 releases are ordinary releases: the feed's "latest" address
      # skips pre-releases (specs/009-updates, research R4).
      - name: Create or refresh the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          VERSION=$(grep -o '"version": "[^"]*"' src-tauri/tauri.conf.json | head -n 1 | cut -d'"' -f4)
          TAG="v$VERSION"
          NOTES="$PWD/.github/release-notes.md"
          cd dist-release
          cat ./*.sha256 > SHA256SUMS.txt
          rm ./*.sha256
          ls -l
          cat SHA256SUMS.txt
          if gh release view "$TAG" --json isDraft >/dev/null 2>&1; then
            if [ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" != "true" ]; then
              echo "::error::$TAG is already published. Raise the version before building again."
              exit 1
            fi
            gh release upload "$TAG" ./* --clobber
          else
            gh release create "$TAG" ./* --draft --target "$TARGET_SHA" --title "Slash Voice $VERSION" --notes-file "$NOTES"
          fi
